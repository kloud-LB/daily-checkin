<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>每日打卡</title>
<style>
/* ===== CSS Variables & Theme ===== */
:root {
  --bg-start: #e8eaf6;
  --bg-end: #f0f2f5;
  --blob-1: rgba(120,140,255,0.15);
  --blob-2: rgba(200,160,255,0.12);
  --blob-3: rgba(100,200,220,0.10);
  --card-bg: rgba(255,255,255,0.35);
  --card-border: rgba(255,255,255,0.6);
  --card-shadow: 0 8px 32px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.5);
  --card-completed-bg: rgba(255,255,255,0.18);
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --text-tertiary: #9ca3af;
  --nav-bg: rgba(255,255,255,0.45);
  --nav-border: rgba(255,255,255,0.65);
  --nav-shadow: 0 -4px 20px rgba(0,0,0,0.04);
  --modal-overlay: rgba(0,0,0,0.25);
  --modal-bg: rgba(255,255,255,0.7);
  --input-bg: rgba(0,0,0,0.04);
  --input-border: rgba(0,0,0,0.08);
  --divider: rgba(0,0,0,0.06);
  --fab-bg: rgba(255,255,255,0.6);
  --fab-shadow: 0 4px 20px rgba(0,0,0,0.12);
  --progress-bg: rgba(0,0,0,0.06);
  --heatmap-empty: rgba(0,0,0,0.04);
  --heatmap-border: rgba(0,0,0,0.06);
  --tooltip-bg: rgba(30,30,40,0.92);
  --tooltip-text: #fff;
  --badge-bg: rgba(0,0,0,0.05);
  --skeleton: rgba(0,0,0,0.06);
  --transition-speed: 0.3s;
}

[data-theme="dark"] {
  --bg-start: #0f0f1a;
  --bg-end: #1a1a30;
  --blob-1: rgba(80,100,255,0.12);
  --blob-2: rgba(160,100,255,0.10);
  --blob-3: rgba(60,160,200,0.08);
  --card-bg: rgba(22,22,38,0.55);
  --card-border: rgba(255,255,255,0.08);
  --card-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.04);
  --card-completed-bg: rgba(22,22,38,0.3);
  --text: #e8e8f0;
  --text-secondary: #9ca3af;
  --text-tertiary: #6b7280;
  --nav-bg: rgba(22,22,38,0.65);
  --nav-border: rgba(255,255,255,0.06);
  --nav-shadow: 0 -4px 20px rgba(0,0,0,0.3);
  --modal-overlay: rgba(0,0,0,0.5);
  --modal-bg: rgba(30,30,50,0.8);
  --input-bg: rgba(255,255,255,0.06);
  --input-border: rgba(255,255,255,0.1);
  --divider: rgba(255,255,255,0.06);
  --fab-bg: rgba(40,40,60,0.7);
  --fab-shadow: 0 4px 20px rgba(0,0,0,0.4);
  --progress-bg: rgba(255,255,255,0.06);
  --heatmap-empty: rgba(255,255,255,0.03);
  --heatmap-border: rgba(255,255,255,0.06);
  --tooltip-bg: rgba(240,240,250,0.95);
  --tooltip-text: #1a1a2e;
  --badge-bg: rgba(255,255,255,0.06);
  --skeleton: rgba(255,255,255,0.04);
}

/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;
  background:linear-gradient(135deg,var(--bg-start),var(--bg-end));
  color:var(--text);
  min-height:100dvh;
  transition:background var(--transition-speed) cubic-bezier(0.4,0,0.2,1),color var(--transition-speed) cubic-bezier(0.4,0,0.2,1);
  overflow-x:hidden;
  position:relative;
}

/* Background blobs (PC only) */
.blobs{display:none;position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
@media(min-width:768px){
  .blobs{display:block}
  .blob{
    position:absolute;border-radius:50%;filter:blur(80px);
    transition:background var(--transition-speed) cubic-bezier(0.4,0,0.2,1);
  }
  .blob-1{width:400px;height:400px;background:var(--blob-1);top:-80px;left:-60px;animation:blobFloat 12s ease-in-out infinite}
  .blob-2{width:350px;height:350px;background:var(--blob-2);top:40%;right:-100px;animation:blobFloat 15s ease-in-out infinite reverse}
  .blob-3{width:300px;height:300px;background:var(--blob-3);bottom:-60px;left:30%;animation:blobFloat 10s ease-in-out infinite 3s}
}
@keyframes blobFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-30px) scale(1.05)}
  66%{transform:translate(-20px,20px) scale(0.95)}
}

/* ===== App Container ===== */
.app{
  position:relative;z-index:1;
  max-width:800px;margin:0 auto;padding:0 16px 120px;
  animation:appFadeIn 0.4s cubic-bezier(0.4,0,0.2,1);
}
@keyframes appFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:768px){.app{padding:0 24px 120px}}

/* ===== Header ===== */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 4px 16px;position:sticky;top:0;z-index:10;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  mask:linear-gradient(to bottom,#000 60%,transparent);
  -webkit-mask:linear-gradient(to bottom,#000 60%,transparent);
}
.header-left h1{font-size:1.6rem;font-weight:700;letter-spacing:-0.02em}
.header-left .date{font-size:0.85rem;color:var(--text-secondary);margin-top:2px;font-weight:500}
.theme-btn{
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  background:var(--card-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--card-border);box-shadow:var(--card-shadow);
  font-size:1.2rem;display:flex;align-items:center;justify-content:center;
  transition:all var(--transition-speed) cubic-bezier(0.4,0,0.2,1);
  color:var(--text);
}
.theme-btn:active{transform:scale(0.92)}

/* ===== Bottom Navigation ===== */
.bottom-nav{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;gap:4px;padding:6px;
  background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--nav-border);border-radius:24px;
  box-shadow:var(--nav-shadow);
}
.nav-item{
  display:flex;align-items:center;gap:6px;padding:10px 20px;
  border-radius:20px;border:none;cursor:pointer;
  background:transparent;color:var(--text-secondary);
  font-size:0.9rem;font-weight:600;font-family:inherit;
  transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
  white-space:nowrap;
}
.nav-item.active{background:rgba(99,102,241,0.15);color:#6366f1}
.nav-item:active{transform:scale(0.95)}
.nav-item .nav-icon{font-size:1.2rem;line-height:1}

/* ===== FAB ===== */
.fab{
  position:fixed;bottom:100px;right:20px;z-index:90;
  width:52px;height:52px;border-radius:50%;border:1px solid var(--card-border);
  background:var(--fab-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:var(--fab-shadow);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;color:var(--text);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  overflow:hidden;
}
.fab:active{transform:scale(0.9)}
.fab .ripple{position:absolute;border-radius:50%;background:rgba(99,102,241,0.3);animation:ripple 0.6s ease-out forwards}
@keyframes ripple{0%{width:0;height:0;opacity:1}100%{width:160px;height:160px;opacity:0}}
@media(min-width:768px){.fab{bottom:100px;right:calc(50% - 370px)}}

/* ===== View Container ===== */
.view{display:none}
.view.active{display:block;animation:viewSlide 0.35s cubic-bezier(0.4,0,0.2,1)}
@keyframes viewSlide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ===== Task Card ===== */
.task-list{display:flex;flex-direction:column;gap:12px}
.task-card{
  display:flex;align-items:center;gap:14px;padding:16px 18px;
  background:var(--card-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--card-border);border-radius:20px;
  box-shadow:var(--card-shadow);
  cursor:pointer;user-select:none;
  transition:all 0.35s cubic-bezier(0.4,0,0.2,1);
  position:relative;overflow:hidden;
}
.task-card:active{transform:scale(0.98)}
.task-card.completed{background:var(--card-completed-bg);opacity:0.7}
.task-card.debouncing{pointer-events:none;opacity:0.85}
.task-card .color-dot{
  width:12px;height:12px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 12px currentColor;
}
.task-card .task-info{flex:1;min-width:0}
.task-card .task-name{font-size:0.95rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-card .task-meta{font-size:0.78rem;color:var(--text-secondary);margin-top:2px}
.task-card .task-progress-bar{
  height:3px;border-radius:3px;background:var(--progress-bg);margin-top:6px;overflow:hidden;
}
.task-card .task-progress-fill{
  height:100%;border-radius:3px;
  transition:width 0.4s cubic-bezier(0.4,0,0.2,1);
}
.task-card .task-actions{display:flex;gap:6px;flex-shrink:0}
.task-card .btn-icon{
  width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  background:var(--badge-bg);font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s ease;color:var(--text-secondary);
}
.task-card .btn-icon:active{transform:scale(0.88)}
.task-card .check-btn{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--card-border);
  background:var(--card-bg);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;color:var(--text-tertiary);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  flex-shrink:0;
}
.task-card .check-btn.done{
  border-color:currentColor;background:currentColor;color:#fff;
}

/* Checkmark animation */
.checkmark-anim{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:5;
}
.checkmark-anim .circle{
  width:60px;height:60px;border-radius:50%;border:3px solid #22c55e;
  animation:checkPop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  display:flex;align-items:center;justify-content:center;
}
.checkmark-anim .check{
  font-size:2rem;color:#22c55e;opacity:0;
  animation:checkShow 0.3s 0.15s ease forwards;
}
@keyframes checkPop{
  0%{transform:scale(0);opacity:0}
  50%{transform:scale(1.2);opacity:1}
  100%{transform:scale(1.6);opacity:0}
}
@keyframes checkShow{from{opacity:0;transform:scale(0.5)}to{opacity:1;transform:scale(1)}}

/* ===== Modal Overlay ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;
  background:var(--modal-overlay);opacity:0;pointer-events:none;
  transition:opacity 0.3s ease;
}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-sheet{
  width:100%;max-width:500px;max-height:85vh;overflow-y:auto;
  background:var(--modal-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:24px 24px 0 0;padding:24px 20px 36px;
  border:1px solid var(--card-border);
  box-shadow:0 -8px 40px rgba(0,0,0,0.12);
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.modal-overlay.show .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--divider);margin:0 auto 20px}
.modal-title{font-size:1.15rem;font-weight:700;margin-bottom:20px;text-align:center}

/* Confirm Dialog (centered) */
.dialog-overlay{
  position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  background:var(--modal-overlay);opacity:0;pointer-events:none;
  transition:opacity 0.25s ease;
}
.dialog-overlay.show{opacity:1;pointer-events:auto}
.dialog-box{
  width:calc(100% - 48px);max-width:340px;padding:24px;
  background:var(--modal-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:20px;border:1px solid var(--card-border);
  box-shadow:0 16px 48px rgba(0,0,0,0.15);
  text-align:center;transform:scale(0.9);
  transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.dialog-overlay.show .dialog-box{transform:scale(1)}
.dialog-text{font-size:0.95rem;margin-bottom:20px;line-height:1.5}
.dialog-buttons{display:flex;gap:10px}
.dialog-buttons button{flex:1;padding:12px;border-radius:14px;border:none;cursor:pointer;font-size:0.9rem;font-weight:600;font-family:inherit;transition:all 0.2s ease}
.dialog-buttons .btn-cancel{background:var(--input-bg);color:var(--text)}
.dialog-buttons .btn-danger{background:#ef4444;color:#fff}
.dialog-buttons button:active{transform:scale(0.95)}

/* ===== Form Elements ===== */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:0.82rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.form-input,.form-select{
  width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--input-border);
  background:var(--input-bg);font-size:0.92rem;font-family:inherit;color:var(--text);
  transition:all 0.2s ease;outline:none;
}
.form-input:focus,.form-select:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,0.15)}
.color-presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.color-preset{
  width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;
  transition:all 0.2s ease;
}
.color-preset:hover{transform:scale(1.15)}
.color-preset.selected{border-color:var(--text);box-shadow:0 0 0 3px rgba(99,102,241,0.2)}
.form-submit{
  width:100%;padding:14px;border-radius:14px;border:none;
  background:#6366f1;color:#fff;font-size:0.95rem;font-weight:600;
  cursor:pointer;font-family:inherit;
  transition:all 0.2s ease;margin-top:8px;
}
.form-submit:active{transform:scale(0.97);opacity:0.9}

/* ===== Heatmap (52 cols x 7 rows, GitHub style) ===== */
.heatmap-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0}
.heatmap-grid{display:flex;gap:3px;min-width:fit-content}
.heatmap-col{display:flex;flex-direction:column;gap:3px}
.heatmap-cell{
  width:11px;height:11px;border-radius:2px;position:relative;cursor:pointer;
  transition:transform 0.15s ease;flex-shrink:0;
}
.heatmap-cell:hover{transform:scale(1.4);z-index:2}
.heatmap-labels-row{display:flex;gap:3px;margin-bottom:2px}
.heatmap-labels-row span{width:11px;text-align:center;font-size:0.55rem;color:var(--text-tertiary)}
.heatmap-labels-col{display:flex;flex-direction:column;gap:3px;margin-right:4px;justify-content:flex-start}
.heatmap-labels-col span{height:11px;line-height:11px;font-size:0.5rem;color:var(--text-tertiary)}

/* Tooltip */
.heatmap-tooltip{
  position:fixed;z-index:400;padding:8px 12px;border-radius:10px;
  background:var(--tooltip-bg);color:var(--tooltip-text);
  font-size:0.78rem;font-weight:500;pointer-events:none;
  opacity:0;transform:translateY(4px);white-space:nowrap;
  transition:opacity 0.2s ease,transform 0.2s ease;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.heatmap-tooltip.show{opacity:1;transform:translateY(0)}

/* Year switcher */
.year-switcher{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0}
.year-switcher button{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--card-border);
  background:var(--card-bg);cursor:pointer;font-size:1rem;color:var(--text);
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s ease;
}
.year-switcher button:active{transform:scale(0.9)}
.year-switcher .year-label{font-size:1rem;font-weight:700}

/* ===== Stats Task Card ===== */
.stats-task-card{
  background:var(--card-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--card-border);border-radius:20px;
  box-shadow:var(--card-shadow);overflow:hidden;margin-bottom:12px;
  transition:all 0.3s ease;
}
.stats-task-header{
  display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;
  transition:all 0.2s ease;
}
.stats-task-header:active{background:var(--input-bg)}
.stats-task-header .expand-icon{
  font-size:0.7rem;color:var(--text-tertiary);
  transition:transform 0.3s ease;
}
.stats-task-card.expanded .expand-icon{transform:rotate(90deg)}
.stats-task-body{
  max-height:0;overflow:hidden;
  transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1);
}
.stats-task-card.expanded .stats-task-body{max-height:900px}
.stats-task-content{padding:0 18px 18px}
.stats-section{margin-top:16px}
.stats-section-title{font-size:0.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:8px}

/* Month Calendar */
.month-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.month-cal .day-header{font-size:0.65rem;color:var(--text-tertiary);padding:4px 0}
.month-cal .day-cell{
  aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:0.7rem;font-weight:600;position:relative;
  transition:all 0.2s ease;
}
.month-cal .day-cell.done{color:#fff}
.month-cal .day-cell.empty{visibility:hidden}
.month-switcher{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px}
.month-switcher button{background:none;border:none;cursor:pointer;font-size:1rem;color:var(--text);padding:4px 8px}
.month-switcher .month-label{font-size:0.85rem;font-weight:600;min-width:80px;text-align:center}

/* Week view */
.week-row{display:flex;gap:6px}
.week-dot{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:0.7rem;font-weight:700;
  transition:all 0.3s ease;
}

/* ===== Empty State ===== */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-tertiary)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:12px}
.empty-state p{font-size:0.9rem}

/* ===== Backfill Sheet ===== */
.backfill-dates{display:flex;flex-direction:column;gap:8px}
.backfill-date-btn{
  padding:14px 18px;border-radius:14px;border:1px solid var(--card-border);
  background:var(--input-bg);cursor:pointer;text-align:left;
  font-size:0.9rem;font-family:inherit;color:var(--text);
  transition:all 0.2s ease;display:flex;justify-content:space-between;align-items:center;
}
.backfill-date-btn:active{transform:scale(0.97)}
.backfill-date-btn:disabled{opacity:0.4;cursor:not-allowed}
.backfill-date-btn .status{font-size:0.8rem;color:var(--text-secondary)}

/* ===== Toast ===== */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:500;
  padding:10px 20px;border-radius:20px;font-size:0.85rem;font-weight:600;
  background:var(--tooltip-bg);color:var(--tooltip-text);
  box-shadow:0 8px 24px rgba(0,0,0,0.2);pointer-events:none;
  opacity:0;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(8px)}

/* ===== Skeleton ===== */
.skeleton{background:var(--skeleton);border-radius:8px;animation:shimmer 1.5s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:0.4}}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:0;height:0}

/* ===== Responsive PC ===== */
@media(min-width:768px){
  .task-list{display:grid;grid-template-columns:repeat(2,1fr)}
  .heatmap-cell{width:14px;height:14px}
  .heatmap-labels-row span{width:14px}
  .heatmap-labels-col span{height:14px;line-height:14px}
}
</style>
</head>
<body data-theme="light">

<div class="blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

<div class="app" id="app">
  <header class="header">
    <div class="header-left">
      <h1>每日打卡</h1>
      <div class="date" id="headerDate"></div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="切换主题">🌙</button>
  </header>

  <!-- Check-in View -->
  <div class="view active" id="viewCheckin">
    <div class="task-list" id="taskList"></div>
    <div class="empty-state" id="emptyState" style="display:none">
      <div class="empty-icon">📋</div>
      <p>还没有任务，点击右下角 + 创建一个吧</p>
    </div>
  </div>

  <!-- Stats View -->

          <div class="heatmap-labels-row" id="heatmapRowLabels"></div>

  </button>
  <button class="nav-item" data-view="viewStats">
    <span class="nav-icon">📊</span> 统计
  </button>

<!-- Task Form Modal -->
<div class="modal-overlay" id="taskModalOverlay">
  <div class="modal-sheet" id="taskModalSheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="taskModalTitle">新建任务</div>

    </div>

      <button class="btn-danger" id="confirmOk">删除</button>

<!-- Backfill Sheet -->
<div class="modal-overlay" id="backfillOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">补打卡</div>
    <div class="backfill-dates" id="backfillDates"></div>
  </div>
</div>

<!-- Checkmark Animation Container -->
<div id="checkmarkContainer"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   Daily Check-in App - localStorage-based PWA
   ================================================================ */
const $ = (s, p) => (p || document).querySelector(s);
const $$ = (s, p) => [...(p || document).querySelectorAll(s)];

// ---- Constants ----
const COLORS = ['#6366f1','#ec4899','#f59e0b','#22c55e','#06b6d4','#ef4444','#8b5cf6','#f97316'];
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DAY_LABELS = ['日','一','二','三','四','五','六'];
const STORAGE_TASKS = 'checkin_tasks';
const STORAGE_HISTORY = 'checkin_history';
const STORAGE_THEME = 'checkin_theme';
const DEBOUNCE_MS = 300;

// ---- State ----
let tasks = [];
let history = {};
let currentView = 'viewCheckin';
let statsYear = new Date().getFullYear();
let editingTaskId = null;
let backfillTaskId = null;
let lastClickTime = {};
let confirmCallback = null;
let toastTimer = null;

// ---- Helpers ----
function todayStr(d) {
  const t = d || new Date();
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
}
function fmtDate(str) {
  const [y,m,d] = str.split('-');
  return y + '年' + parseInt(m) + '月' + parseInt(d) + '日';
}
function weekday(str) { return DAY_LABELS[new Date(str).getDay()]; }

// ---- Data ----
function loadTasks() {
  try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS)) || []; }
  catch(e) { tasks = []; }
}
function saveTasks() { localStorage.setItem(STORAGE_TASKS, JSON.stringify(tasks)); }
function loadHistory() {
  try { history = JSON.parse(localStorage.getItem(STORAGE_HISTORY)) || {}; }
  catch(e) { history = {}; }
}
function saveHistory() { localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history)); }

function getTaskProgress(taskId, dateStr) {
  const dayData = history[dateStr];
  if (!dayData || !dayData[taskId]) return 0;
  return dayData[taskId].count || 0;
}
function isTaskDone(taskId, dateStr) {
  const task = tasks.find(function(t) { return t.id === taskId; });
  if (!task) return false;
  return getTaskProgress(taskId, dateStr) >= task.targetCount;
}

// ---- Theme ----
function initTheme() {
  var saved = localStorage.getItem(STORAGE_THEME);
  var theme;
  if (saved === 'dark' || saved === 'light') theme = saved;
  else theme = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  applyTheme(theme);
}
function applyTheme(theme) {
  document.body.dataset.theme = theme;
  $('#themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem(STORAGE_THEME, theme);
}
function toggleTheme() {
  var next = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  // Re-render stats if visible to update heatmap colors
  if (currentView === 'viewStats') renderStats();
}

// ---- Sound ----
function playDing() {
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    var ctx = new C();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(1200, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.08);
    g.gain.setValueAtTime(0.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + 0.25);
  } catch(e) {}
}


// ---- Toast ----
function showToast(msg, duration) {
  duration = duration || 1800;
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, duration);
}

// ---- Checkmark Animation ----
function showCheckmark(card) {
  var rect = card.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  var div = document.createElement('div');
  div.className = 'checkmark-anim';
  div.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:50;pointer-events:none';
  var circle = document.createElement('div');
  circle.className = 'circle';
  circle.style.cssText = 'position:absolute;left:' + (cx - 30) + 'px;top:' + (cy - 30) + 'px';
  circle.innerHTML = '<span class="check">✓</span>';
  div.appendChild(circle);
  document.body.appendChild(div);
  setTimeout(function() { div.remove(); }, 600);
}

// ---- Task Sorting ----
function sortTasksForDisplay(list) {
  var today = todayStr();
  var uncompleted = list.filter(function(t) { return !isTaskDone(t.id, today); });
  var completed = list.filter(function(t) { return isTaskDone(t.id, today); });
  uncompleted.sort(function(a, b) { return a.createdAt - b.createdAt; });
  completed.sort(function(a, b) {
    var aTime = (history[today] && history[today][a.id]) ? (history[today][a.id].completedAt || 0) : 0;
    var bTime = (history[today] && history[today][b.id]) ? (history[today][b.id].completedAt || 0) : 0;
    return aTime - bTime;
  });
  return uncompleted.concat(completed);
}

// ---- Render Tasks ----
function renderTasks() {
  var list = $('#taskList');
  var empty = $('#emptyState');
  var sorted = sortTasksForDisplay(tasks);
  if (tasks.length === 0) { list.innerHTML = ''; empty.style.display = ''; return; }
  empty.style.display = 'none';

  var today = todayStr();
  list.innerHTML = sorted.map(function(t) {
    var done = isTaskDone(t.id, today);
    var progress = getTaskProgress(t.id, today);
    var pct = Math.min(100, (progress / t.targetCount) * 100);
    var cls = 'task-card' + (done ? ' completed' : '');
    var checkCls = 'check-btn' + (t.targetCount > 1 ? ' count-btn' : '') + (done ? ' done' : '');
    var checkContent = done ? '✓' : (t.targetCount > 1 ? progress : '');
    return '<div class="' + cls + '" data-task-id="' + t.id + '">' +
      '<div class="color-dot" style="background:' + t.color + ';color:' + t.color + '"></div>' +
      '<div class="task-info">' +
        '<div class="task-name">' + escHtml(t.name) + '</div>' +
        '<div class="task-meta">' + progress + ' / ' + t.targetCount + '</div>' +
        (t.targetCount > 1 ? '<div class="task-progress-bar"><div class="task-progress-fill" style="width:' + pct + '%;background:' + t.color + '"></div></div>' : '') +
      '</div>' +
      '<div class="task-actions">' +
        '<button class="btn-icon backfill-btn" data-task-id="' + t.id + '" title="补打卡" style="font-size:0.85rem">📅</button>' +
        '<button class="btn-icon edit-btn" data-task-id="' + t.id + '" title="编辑">✎</button>' +
        '<button class="btn-icon delete-btn" data-task-id="' + t.id + '" title="删除">🗑</button>' +
      '</div>' +
      '<div class="' + checkCls + '" style="color:' + t.color + ';' + (t.targetCount > 1 && !done ? 'font-size:0.85rem;font-weight:700' : '') + '">' + checkContent + '</div>' +
    '</div>';
  }).join('');

  // Delegate events
  list.onclick = function(e) {
    var card = e.target.closest('.task-card');
    if (!card) return;
    var taskId = card.dataset.taskId;
    if (e.target.closest('.edit-btn')) { openEditModal(taskId); return; }
    if (e.target.closest('.delete-btn')) { confirmDelete(taskId); return; }
    if (e.target.closest('.backfill-btn')) { openBackfill(taskId); return; }
    handleCheckin(taskId, card);
  };
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---- Check-in Logic ----
function handleCheckin(taskId, card) {
  var now = Date.now();
  if (lastClickTime[taskId] && now - lastClickTime[taskId] < DEBOUNCE_MS) return;
  lastClickTime[taskId] = now;

  var task = tasks.find(function(t) { return t.id === taskId; });
  if (!task) return;
  var today = todayStr();
  if (isTaskDone(taskId, today)) return;

  if (!history[today]) history[today] = {};
  if (!history[today][taskId]) history[today][taskId] = { count: 0 };
  history[today][taskId].count++;
  history[today][taskId].completedAt = now;
  saveHistory();
  playDing();

  if (task.targetCount === 1 || isTaskDone(taskId, today)) {
    showCheckmark(card);
  }
  renderTasks();
}

// ---- Task CRUD ----
function openAddModal() {
  editingTaskId = null;
  $('#taskModalTitle').textContent = '新建任务';
  $('#taskNameInput').value = '';
  $('#taskCountInput').value = '1';
  $('#taskColorInput').value = '#6366f1';
  updateColorSelection('#6366f1');
  $('#taskModalOverlay').classList.add('show');
  setTimeout(function() { $('#taskNameInput').focus(); }, 350);
}
function openEditModal(taskId) {
  var task = tasks.find(function(t) { return t.id === taskId; });
  if (!task) return;
  editingTaskId = taskId;
  $('#taskModalTitle').textContent = '编辑任务';
  $('#taskNameInput').value = task.name;
  $('#taskCountInput').value = task.targetCount;
  $('#taskColorInput').value = task.color;
  updateColorSelection(task.color);
  $('#taskModalOverlay').classList.add('show');
}
function closeTaskModal() {
  $('#taskModalOverlay').classList.remove('show');
  editingTaskId = null;
}
function saveTask() {
  var name = $('#taskNameInput').value.trim();
  var count = parseInt($('#taskCountInput').value) || 1;
  var color = $('#taskColorInput').value;
  if (!name) { showToast('请输入任务名称'); return; }
  count = Math.max(1, Math.min(99, count));

  if (editingTaskId) {
    var idx = tasks.findIndex(function(t) { return t.id === editingTaskId; });
    if (idx >= 0) { tasks[idx].name = name; tasks[idx].targetCount = count; tasks[idx].color = color; }
  } else {
    tasks.push({
      id: Date.now().toString(),
      name: name,
      targetCount: count,
      color: color,
      createdAt: Date.now()
    });
  }
  saveTasks(); closeTaskModal(); renderTasks(); renderStats();
  showToast(editingTaskId ? '任务已更新' : '任务已创建');
}

function confirmDelete(taskId) {
  var task = tasks.find(function(t) { return t.id === taskId; });
  if (!task) return;
  $('#confirmText').textContent = '确定要删除「' + task.name + '」吗？历史数据将保留。';
  $('#confirmDialog').classList.add('show');
  confirmCallback = function() {
    tasks = tasks.filter(function(t) { return t.id !== taskId; });
    saveTasks(); renderTasks(); renderStats();
    $('#confirmDialog').classList.remove('show');
    showToast('任务已删除');
  };
}

// ---- Backfill ----
function openBackfill(taskId) {
  backfillTaskId = taskId;
  var today = new Date();
  var dates = [];
  for (var i = 1; i <= 2; i++) {
    var d = new Date(today); d.setDate(d.getDate() - i);
    dates.push(todayStr(d));
  }
  var task = tasks.find(function(t) { return t.id === taskId; });
  $('#backfillDates').innerHTML = dates.map(function(d) {
    var done = isTaskDone(taskId, d);
    var prog = getTaskProgress(taskId, d);
    var label = fmtDate(d) + ' 周' + weekday(d);
    var status = done ? '已完成' : (prog > 0 ? prog + '/' + task.targetCount : '未打卡');
    return '<button class="backfill-date-btn" data-date="' + d + '"' + (done ? ' disabled' : '') + '>' +
      '<span>' + label + '</span><span class="status">' + status + '</span></button>';
  }).join('');
  $('#backfillOverlay').classList.add('show');

  $('#backfillDates').onclick = function(e) {
    var btn = e.target.closest('.backfill-date-btn');
    if (!btn || btn.disabled) return;
    var dateStr = btn.dataset.date;
    var t = tasks.find(function(t) { return t.id === backfillTaskId; });
    if (!t) return;
    if (isTaskDone(backfillTaskId, dateStr)) return;

    if (!history[dateStr]) history[dateStr] = {};
    if (!history[dateStr][backfillTaskId]) history[dateStr][backfillTaskId] = { count: 0 };
    history[dateStr][backfillTaskId].count++;
    history[dateStr][backfillTaskId].completedAt = Date.now();
    saveHistory(); playDing();
    openBackfill(backfillTaskId);
    renderTasks(); renderStats();
  };
}
function closeBackfill() {
  $('#backfillOverlay').classList.remove('show');
  backfillTaskId = null;
}

// ---- Color Selection ----
function updateColorSelection(color) {
  $('#colorPresets').innerHTML = COLORS.map(function(c) {
    return '<div class="color-preset' + (c === color ? ' selected' : '') + '" style="background:' + c + '" data-color="' + c + '"></div>';
  }).join('');
  $$('.color-preset').forEach(function(el) {
    el.onclick = function() {
      $('#taskColorInput').value = el.dataset.color;
      updateColorSelection(el.dataset.color);
    };
  });
}

// ---- Stats: Heatmap ----
function getHeatmapGrid(year) {
  var jan1 = new Date(year, 0, 1);
  var startDay = jan1.getDay();
  var start = new Date(jan1);
  start.setDate(jan1.getDate() - startDay);

  var grid = [];
  for (var row = 0; row < 7; row++) {
    grid[row] = [];
    for (var col = 0; col < 52; col++) {
      var d = new Date(start);
      d.setDate(start.getDate() + col * 7 + row);
      grid[row][col] = d;
    }
  }
  return grid;
}

function getCompletionRate(dateStr) {
  if (tasks.length === 0) return 0;
  var dayData = history[dateStr];
  if (!dayData) return 0;
  var totalDone = 0, totalTarget = 0;
  tasks.forEach(function(t) {
    totalTarget += t.targetCount;
    if (dayData[t.id]) totalDone += Math.min(dayData[t.id].count || 0, t.targetCount);
  });
  return totalTarget > 0 ? totalDone / totalTarget : 0;
}

function getTaskCompletionRate(taskId, dateStr) {
  var task = tasks.find(function(t) { return t.id === taskId; });
  if (!task) return 0;
  var dayData = history[dateStr];
  if (!dayData || !dayData[taskId]) return 0;
  return Math.min(1, (dayData[taskId].count || 0) / task.targetCount);
}

function heatmapColor(rate, accentColor) {
  if (rate <= 0) return 'var(--heatmap-empty)';
  if (rate >= 1) return accentColor;
  var alpha = (0.12 + rate * 0.88).toFixed(2);
  return accentColor.replace(')', ', ' + alpha + ')').replace('rgb', 'rgba');
}

function heatmapColorOverview(rate) {
  if (rate <= 0) return 'var(--heatmap-empty)';
  var dark = document.body.dataset.theme === 'dark';
  var alpha = (0.12 + rate * 0.88).toFixed(2);
  return 'rgba(99,102,241,' + alpha + ')';
}

function renderOverviewHeatmap() {
  var grid = getHeatmapGrid(statsYear);

  var colMonths = [];
  for (var col = 0; col < 52; col++) {
    colMonths.push(grid[0][col].getMonth());
  }
  var prevMonth = -1;
  var rowLabelsHtml = colMonths.map(function(m, i) {
    if (m !== prevMonth) { prevMonth = m; return MONTHS[m]; }
    return '';
  }).map(function(s) { return '<span>' + s + '</span>'; }).join('');
  $('#heatmapRowLabels').innerHTML = rowLabelsHtml;

  $('#heatmapColLabels').innerHTML = DAY_LABELS.map(function(s) { return '<span>' + s + '</span>'; }).join('');

  var cellsHtml = '';
  for (var row = 0; row < 7; row++) {
    cellsHtml += '<div class="heatmap-col">';
    for (var col = 0; col < 52; col++) {
      var d = grid[row][col];
      var dateStr = todayStr(d);
      var inYear = d.getFullYear() === statsYear;
      var rate = inYear ? getCompletionRate(dateStr) : -1;
      var bg = inYear ? heatmapColorOverview(rate) : 'transparent';
      var border = inYear ? 'var(--heatmap-border)' : 'transparent';
      cellsHtml += '<div class="heatmap-cell" style="background:' + bg + ';border:1px solid ' + border + '"' +
        ' data-date="' + dateStr + '" data-rate="' + rate.toFixed(2) + '" data-inyear="' + inYear + '"></div>';
    }
    cellsHtml += '</div>';
  }
  $('#heatmapGrid').innerHTML = cellsHtml;

  var tooltip = $('#heatmapTooltip');
  $('#heatmapGrid').querySelectorAll('.heatmap-cell').forEach(function(cell) {
    cell.addEventListener('mouseenter', function(e) {
      if (cell.dataset.inyear !== 'true') return;
      var rect = cell.getBoundingClientRect();
      var ratePct = Math.round(parseFloat(cell.dataset.rate) * 100);
      tooltip.textContent = fmtDate(cell.dataset.date) + ': ' + ratePct + '%';
      tooltip.style.left = (rect.left + rect.width / 2) + 'px';
      tooltip.style.top = (rect.top - 32) + 'px';
      tooltip.style.transform = 'translate(-50%,0)';
      tooltip.classList.add('show');
    });
    cell.addEventListener('mouseleave', function() { tooltip.classList.remove('show'); });
    cell.addEventListener('click', function() {
      if (cell.dataset.inyear !== 'true') return;
      tooltip.classList.add('show');
      setTimeout(function() { tooltip.classList.remove('show'); }, 2500);
      var dateStr = cell.dataset.date;
      var ratePct = Math.round(parseFloat(cell.dataset.rate) * 100);
      var dayData = history[dateStr] || {};
      var detail = tasks.map(function(t) {
        var c = dayData[t.id] ? (dayData[t.id].count || 0) : 0;
        return t.name + ': ' + c + '/' + t.targetCount;
      }).join('  ');
      if (!detail) detail = '无记录';
      showToast(fmtDate(dateStr) + '  完成率 ' + ratePct + '%  ' + detail, 3000);
    });
  });
}

// ---- Stats: Per-Task ----
function countTotalCompletions(taskId) {
  var count = 0;
  var task = tasks.find(function(t) { return t.id === taskId; });
  if (!task) return 0;
  Object.values(history).forEach(function(dayData) {
    if (dayData[taskId]) count += Math.min(dayData[taskId].count || 0, task.targetCount);
  });
  return count;
}

function countYearCompletions(taskId, year) {
  var count = 0;
  var task = tasks.find(function(t) { return t.id === taskId; });
  if (!task) return 0;
  Object.entries(history).forEach(function(entry) {
    var dateStr = entry[0], dayData = entry[1];
    if (dateStr.indexOf(String(year)) === 0 && dayData[taskId]) {
      count += Math.min(dayData[taskId].count || 0, task.targetCount);
    }
  });
  return count;
}

function buildTaskHeatmap(task) {
  var grid = getHeatmapGrid(statsYear);

  // Row labels: month indicators
  var rowLabelsHtml = '';
  var prevMonth = -1;
  for (var row = 0; row < 52; row++) {
    var m = grid[0][row].getMonth();
    if (m !== prevMonth) { prevMonth = m; rowLabelsHtml += '<span>' + MONTHS[m] + '</span>'; }
    else { rowLabelsHtml += '<span></span>'; }
  }

  var html = '<div class="heatmap-col-labels">' + DAY_LABELS.map(function(s) { return '<span>' + s + '</span>'; }).join('') + '</div>';
  html += '<div style="display:flex">';
  html += '<div class="heatmap-row-labels">' + rowLabelsHtml + '</div>';
  html += '<div class="heatmap-grid">';
  for (var row = 0; row < 52; row++) {
    html += '<div class="heatmap-row">';
    for (var col = 0; col < 7; col++) {
      var d = grid[col][row];
      var dateStr = todayStr(d);
      var inYear = d.getFullYear() === statsYear;
      var rate = inYear ? getTaskCompletionRate(task.id, dateStr) : -1;
      var bg = inYear ? heatmapColor(rate, task.color) : 'transparent';
      var border = inYear ? 'var(--heatmap-border)' : 'transparent';
      html += '<div class="heatmap-cell" style="background:' + bg + ';border:1px solid ' + border + '"></div>';
    }
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function initTaskMonthView(taskId, year, month) {
  var card = document.querySelector('.stats-task-card[data-task-id="' + taskId + '"]');
  if (!card) return;
  var label = card.querySelector('.month-label[data-task="' + taskId + '"]');
  var cal = card.querySelector('.month-cal[data-task="' + taskId + '"]');
  if (label) label.textContent = year + '年 ' + MONTHS[month];
  if (!cal) return;
  var task = tasks.find(function(t) { return t.id === taskId; });
  if (!task) return;

  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var html = DAY_LABELS.map(function(s) { return '<div class="day-header">' + s + '</div>'; }).join('');
  for (var i = 0; i < firstDay; i++) html += '<div class="day-cell empty"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var done = isTaskDone(taskId, ds);
    var bg = done ? task.color : 'var(--heatmap-empty)';
    html += '<div class="day-cell' + (done ? ' done' : '') + '" style="background:' + bg + '">' + d + '</div>';
  }
  cal.innerHTML = html;
}

function initTaskWeekView(taskId) {
  var card = document.querySelector('.stats-task-card[data-task-id="' + taskId + '"]');
  if (!card) return;
  var row = card.querySelector('.week-row[data-task="' + taskId + '"]');
  if (!row) return;
  var task = tasks.find(function(t) { return t.id === taskId; });
  if (!task) return;

  var now = new Date();
  var dayOfWeek = now.getDay();
  var monday = new Date(now);
  monday.setDate(now.getDate() - (dayOfWeek === 0 ? 6 : dayOfWeek - 1));

  var html = '';
  for (var i = 0; i < 7; i++) {
    var d = new Date(monday);
    d.setDate(monday.getDate() + i);
    var ds = todayStr(d);
    var done = isTaskDone(taskId, ds);
    var prog = getTaskProgress(taskId, ds);
    var isToday = ds === todayStr();
    var bg = done ? task.color : (prog > 0 ? task.color + '44' : 'var(--heatmap-empty)');
    var text = done ? '✓' : (prog > 0 ? prog : '');
    var border = isToday ? '2px solid ' + task.color : '1px solid var(--heatmap-border)';
    html += '<div class="week-dot" style="background:' + bg + ';border:' + border + ';color:' + (done ? '#fff' : 'var(--text-secondary)') + '">' + text + '</div>';
  }
  row.innerHTML = html;
}

function renderTaskStats() {
  var container = $('#statsTaskList');
  if (tasks.length === 0) { container.innerHTML = ''; return; }

  container.innerHTML = tasks.map(function(t) {
    var totalCompletions = countTotalCompletions(t.id);
    var yearDone = countYearCompletions(t.id, statsYear);
    return '<div class="stats-task-card" data-task-id="' + t.id + '">' +
      '<div class="stats-task-header">' +
        '<div class="color-dot" style="background:' + t.color + ';color:' + t.color + ';width:10px;height:10px"></div>' +
        '<span style="flex:1;font-weight:600;font-size:0.9rem">' + escHtml(t.name) + '</span>' +
        '<span style="font-size:0.78rem;color:var(--text-secondary)">' + yearDone + '次 / 年</span>' +
        '<span class="expand-icon">▶</span>' +
      '</div>' +
      '<div class="stats-task-body">' +
        '<div class="stats-task-content">' +
          '<div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px">' +
            '历史总计：<strong style="color:var(--text)">' + totalCompletions + ' 次</strong>' +
          '</div>' +
          '<div class="stats-section">' +
            '<div class="stats-section-title">年度视图</div>' +
            '<div class="heatmap-wrap"><div style="display:flex">' +
              '<div class="heatmap-labels-col">' + DAY_LABELS.map(function(s) { return '<span>' + s + '</span>'; }).join('') + '</div>' +
              '<div>' + buildTaskHeatmap(t) + '</div>' +
            '</div></div>' +
          '</div>' +
          '<div class="stats-section">' +
            '<div class="stats-section-title">月度视图</div>' +
            '<div class="month-switcher">' +
              '<button class="month-prev" data-task="' + t.id + '">◂</button>' +
              '<span class="month-label" data-task="' + t.id + '"></span>' +
              '<button class="month-next" data-task="' + t.id + '">▸</button>' +
            '</div>' +
            '<div class="month-cal" data-task="' + t.id + '"></div>' +
          '</div>' +
          '<div class="stats-section">' +
            '<div class="stats-section-title">本周</div>' +
            '<div class="week-row" data-task="' + t.id + '"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  // Bind expand & month switchers
  container.querySelectorAll('.stats-task-card').forEach(function(card) {
    var taskId = card.dataset.taskId;
    var monthState = { year: new Date().getFullYear(), month: new Date().getMonth() };

    card.querySelector('.stats-task-header').onclick = function() {
      var expanded = card.classList.contains('expanded');
      if (expanded) {
        card.classList.remove('expanded');
      } else {
        card.classList.add('expanded');
        monthState.year = new Date().getFullYear();
        monthState.month = new Date().getMonth();
        initTaskMonthView(taskId, monthState.year, monthState.month);
        initTaskWeekView(taskId);
      }
    };
    card.querySelector('.month-prev').onclick = function(e) {
      e.stopPropagation();
      monthState.month--;
      if (monthState.month < 0) { monthState.month = 11; monthState.year--; }
      initTaskMonthView(taskId, monthState.year, monthState.month);
    };
    card.querySelector('.month-next').onclick = function(e) {
      e.stopPropagation();
      monthState.month++;
      if (monthState.month > 11) { monthState.month = 0; monthState.year++; }
      initTaskMonthView(taskId, monthState.year, monthState.month);
    };
  });
}

// ---- Stats Render ----
function renderStats() {
  if (currentView !== 'viewStats') return;
  $('#yearLabel').textContent = statsYear + '年';
  renderOverviewHeatmap();
  renderTaskStats();
}

// ---- Navigation ----
function switchView(viewName) {
  currentView = viewName;
  $$('.view').forEach(function(v) { v.classList.remove('active'); });
  $('#' + viewName).classList.add('active');
  $$('.nav-item').forEach(function(n) { n.classList.toggle('active', n.dataset.view === viewName); });
  if (viewName === 'viewStats') renderStats();
  if (viewName === 'viewCheckin') renderTasks();
}

// ---- Event Bindings ----
function bindEvents() {
  $('#themeBtn').onclick = toggleTheme;

  $('#fabBtn').onclick = function(e) {
    var ripple = document.createElement('div');
    ripple.className = 'ripple';
    e.currentTarget.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 600);
    if (currentView === 'viewCheckin') openAddModal();
    else switchView('viewCheckin');
  };

  $$('.nav-item').forEach(function(n) { n.onclick = function() { switchView(n.dataset.view); }; });

  $('#taskModalOverlay').onclick = function(e) { if (e.target === $('#taskModalOverlay')) closeTaskModal(); };
  $('#taskFormSubmit').onclick = saveTask;
  $('#taskColorInput').oninput = function() { updateColorSelection($('#taskColorInput').value); };

  $('#confirmCancel').onclick = function() { $('#confirmDialog').classList.remove('show'); confirmCallback = null; };
  $('#confirmOk').onclick = function() { if (confirmCallback) confirmCallback(); };
  $('#confirmDialog').onclick = function(e) { if (e.target === $('#confirmDialog')) { $('#confirmDialog').classList.remove('show'); confirmCallback = null; } };

  $('#backfillOverlay').onclick = function(e) { if (e.target === $('#backfillOverlay')) closeBackfill(); };

  $('#yearPrev').onclick = function() { statsYear--; renderStats(); };
  $('#yearNext').onclick = function() { statsYear++; renderStats(); };

  // Keyboard
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if ($('#confirmDialog').classList.contains('show')) { $('#confirmDialog').classList.remove('show'); confirmCallback = null; }
      else if ($('#backfillOverlay').classList.contains('show')) closeBackfill();
      else if ($('#taskModalOverlay').classList.contains('show')) closeTaskModal();
    }
  });

  // System theme change
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(e) {
    var saved = localStorage.getItem(STORAGE_THEME);
    if (!saved || saved === 'auto') {
      applyTheme(e.matches ? 'dark' : 'light');
      if (currentView === 'viewStats') renderStats();
    }
  });
}

// ---- Init ----
function init() {
  initTheme();
  loadTasks();
  loadHistory();
  updateColorSelection('#6366f1');

  var now = new Date();
  $('#headerDate').textContent = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 周' + DAY_LABELS[now.getDay()];

  bindEvents();
  renderTasks();
}

// ---- Start ----
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
